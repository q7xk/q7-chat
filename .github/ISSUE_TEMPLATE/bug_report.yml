name: Bug report
description: Report a reproducible bug in Q7 Chat
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include private keys, passwords, message contents or other sensitive data.

        For security vulnerabilities, follow the repository's SECURITY.md policy instead of opening a public issue.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: When I ..., the app ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error messages or console output. Remove sensitive values.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA.
      placeholder: "0.1.0 or abc1234"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop
        - Android
        - iOS / iPadOS
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      description: Where did the problem occur?
      options:
        - Local notes / local mode
        - Direct P2P (online)
        - Relay mode
        - Pairing / connection
        - Device linking
        - Unknown
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, network conditions or anything else that helps.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
        - label: This report does not contain passwords, private keys or other people's private data.
          required: true
