name: Feature request
description: Suggest a feature or improvement for Q7 Chat
title: "feat: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Q7 Chat is privacy-first and intentionally small, so please explain the problem before the solution.

        Features that weaken the threat model, add trackers, or require a central account server are unlikely to be accepted.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who experiences it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other apps, or simpler approaches.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Messaging
        - Pairing and contacts
        - Groups
        - Privacy and security
        - Storage and backup
        - Accessibility
        - Internationalization
        - Performance
        - Documentation
        - Build and deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Does this send new data to relays? Add metadata? Change the threat model?
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request does not require a central account database.
          required: true
