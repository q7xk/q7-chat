# WebSocket listener for Q7 Chat. Caddy terminates TLS and proxies to this port.
listener 8084
protocol websockets

allow_anonymous true
max_connections 1000
max_keepalive 120

# Q7 sync snapshots are capped below 200 KB and live frames far below that.
message_size_limit 262144

persistence true
persistence_location /mosquitto/data/
retained_persistence true

log_dest stdout
log_type warning
log_type error
connection_messages true
